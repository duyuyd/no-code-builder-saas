name: Typecheck and Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Export regression
        run: npm run test:export
      - name: Provider regression
        run: npm run test:ai
      - name: Timeline regression
        run: npm run test:timeline

      - name: NPC state machine regression
        run: npm run test:npc
      - name: Native build workflow contracts
        run: npm run test:native
