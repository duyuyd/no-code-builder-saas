name: Typecheck and Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Export regression
        run: npm run test:export
      - name: Provider regression
        run: npm run test:ai
      - name: Timeline regression
        run: npm run test:timeline

      - name: NPC state machine regression
        run: npm run test:npc
      - name: Native build workflow contracts
        run: npm run test:native

      - name: SEO, AI Generator, Figma and Yjs collaboration regression
        run: npm run test:growth

      - name: Ecosystem component, payments and security regression
        run: npm run test:ecosystem
      - name: Chai JSONB bridge regression
        run: npm run test:chai
      - name: Auto-Database regression
        run: npm run test:forms
      - name: Unified editor data preservation regression
        run: npm run test:unified

      - name: Absolute Lockdown v14 API and dependency contracts
        run: npm run test:v14

      - name: Public branding audit
        run: |
          if git grep -n -F "$(printf '%s%s' No '-Code Builder')"; then echo "Retired brand string remains"; exit 1; fi
          if git grep -n -F "$(printf '%s%s' 'NPT Duy' ' Studio')"; then echo "Retired studio string remains"; exit 1; fi

      - name: v15 actual source deletion and grep regression
        run: |
          npm run test:v15
          sha256sum app/builder/page.tsx components/chaibuilder/UnifiedChaiEditor.tsx app/api/figma/route.ts app/api/render-video/route.ts app/api/create-table/route.ts

      - name: v16 Form/Figma loading, toasts and browser proof contracts
        run: npm run test:v16
