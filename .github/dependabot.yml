version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:10"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    groups:
      routine-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:40"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
