name: Bug report
description: Report a reproducible problem in the NuvoraCraft project
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Do not share API keys or personal data. For vulnerabilities see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. Observe ..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Builder / responsive
        - Login / Supabase
        - OpenAI Copilot / Vision / NPC
        - 3D / Timeline / XR
        - Commerce / Marketplace
        - Build / Deployment
        - Other
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sanitized screenshots, CI logs, console output
